name: Daily job search

on:
  schedule:
    - cron: "0 12 * * *" # 8:00 AM Boston (EDT); 7:00 AM in winter
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the jobs it would score (no Claude calls, no writes)"
        type: boolean
        default: false

concurrency: daily-job-search

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run daily -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          JOB_AGENT_FOLDER_ID: ${{ vars.JOB_AGENT_FOLDER_ID }}
