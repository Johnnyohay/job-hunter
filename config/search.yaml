# Cheap keyword pre-filter applied before any job is sent to Claude.
# A job passes if its title matches any `include` term and no `exclude` term (case-insensitive).
# The real judgment (fit, seniority, preferences) happens in Claude against your Drive docs.
include:
  - deployment
  - deployed
  - strategy
  - operations
  - "bizops"
  - "business operations"
  - "solutions"
  - "customer success"
  - "technical account"
  - "implementation"
  - "engagement manager"
  - "program manager"
  - "product operations"
  - "gtm"
  - "chief of staff"
  - "ai "
exclude:
  - intern
  - "software engineer"
  - "data engineer"
  - recruiter
  - counsel
  - "account executive"
  - director
  - "vice president"
  - "vp "
  - principal

# Locations: a job passes if its location mentions any of these (whole words).
# "Remote - USA" passes via "usa"; "Remote - Australia" does not. Leave empty to allow everywhere.
locations:
  - boston
  - massachusetts
  - new york
  - nyc
  - "united states"
  - usa
  - us
  - "north america"

limits:
  maxScoredPerRun: 60      # at most this many new jobs sent to Claude per day
  maxTailoredPerRun: 5     # default; "Max applications per day" in Job Preferences overrides
  minFit: 70               # default; "Minimum fit score" in Job Preferences overrides
